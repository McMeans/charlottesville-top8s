{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tab_title }}</title>
    <link rel="icon" href="{% static 'siteicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'style.css' %}?v=23">
</head>

<body>
    <header class="site-header">
        <img class="site-logo" src="{% static 'images/top8sLogo.png' %}" alt="Top 8s Logo">
    </header>

    <main class="main-content">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>Created by Luke McMeans (2024)</p>
            <p>Inspired by <a href="https://www.top8er.com/" target="_blank" rel="noopener">top8er.com</a> by @Riokaru and @Elenriqu3</p>
            <p>Built and maintained using Django, Pillow, and Fly.io. Images and assets from Super Smash Bros. Ultimate belong to Nintendo and Sora Ltd.</p>
        </div>
    </footer>
</body>
</html>
